name: flaky detector

# Runs the replayable suite repeatedly without retries and reports every test that fails intermittently.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      runs:
        description: Number of repetitions
        default: '10'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      TEST_RETRIES: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: current

      - name: Repeat the suite
        run: |
          runs="${{ github.event.inputs.runs || '10' }}"
          mkdir -p flaky
          for i in $(seq 1 "$runs"); do
            ./gradlew :telegram-bot:jvmTest --rerun --continue || true
            python3 .github/scripts/collect_failures.py telegram-bot/build/test-results/jvmTest >> flaky/failures.txt
          done
          echo "## Failures by test over $runs runs" >> "$GITHUB_STEP_SUMMARY"
          if [ -s flaky/failures.txt ]; then
            sort flaky/failures.txt | uniq -c | sort -rn | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No flaky tests detected." >> "$GITHUB_STEP_SUMMARY"
