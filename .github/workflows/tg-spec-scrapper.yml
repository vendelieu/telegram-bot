on:
  workflow_dispatch:

name: Scrape Telegram bot API
jobs:
  build:
    name: Scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: >
          pip install requests==2.32.3 beautifulsoup4==4.12.3 html5lib==1.1

      - name: Scrape API
        run: python buildSrc/src/main/resources/scrape.py

      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: Update Bot API spec.
          branch: dev