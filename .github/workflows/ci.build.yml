name: build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.editorconfig'
      - '.gitignore'
      # CHANGELOG.md included so release merges (CHANGELOG-only) trigger build
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'FUNDING.yml'
      - 'LICENSE'
      - 'README.md'
      - 'SECURITY.md'
      - 'parse_changelog.sh'
      - 'renovate.json'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '.editorconfig'
      - '.gitignore'
      - 'CHANGELOG.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'FUNDING.yml'
      - 'LICENSE'
      - 'README.md'
      - 'SECURITY.md'
      - 'parse_changelog.sh'
      - 'renovate.json'
      - 'assets/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
          dependency-graph: generate-and-submit

      - name: Cache konan dependencies
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/libs.versions.toml')}}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # The required gate is deterministic: Telegram responses are replayed from src/jvmTest/resources/tg-fixtures,
      # so no secrets or network are needed (works for forks and dependency PRs too).
      - name: Build artifact
        run: ./gradlew koverXmlReport

      - name: Check KSP golden files are up to date
        run: |
          ./gradlew :ktnip:updateGolden
          if [ -n "$(git status --porcelain -- ktnip/src/jvmTest/resources)" ]; then
            echo "::error::Golden files are stale, run ./gradlew :ktnip:updateGolden and commit the result"
            git status --porcelain -- ktnip/src/jvmTest/resources
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: telegram-bot/build/reports/kover/report.xml
          verbose: true
